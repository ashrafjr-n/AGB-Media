<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mirrors --color-black in src/styles/variables.css; update both together. -->
    <meta name="theme-color" content="#010101" />
    <!--
      THIS IS THE STATIC FALLBACK ONLY — every route overwrites title, description,
      robots, canonical and Open Graph/Twitter tags at mount via <Seo> (see
      components/shared/Seo.jsx), which uses react-helmet-async to rewrite this
      <head> per route. What is here is what a crawler or share card sees before
      that JS has run, and what "/" itself falls back to if it somehow does not, so
      it deliberately matches the home page's own <Seo> values rather than the old
      one-line site description.
    -->
    <meta
      name="description"
      content="AGB Media is a Doha-based arts and media production house specializing in film, television, theatre, animation, and post-production across Qatar and the Gulf."
    />
    <meta name="robots" content="index, follow" />

    <!--
      THE FAVICON SET — five raster sizes plus the manifest's own two, all generated
      from public/assets/images/agb-logo.png (the untouched mark, letterboxed onto a
      square --color-black canvas rather than cropped or redrawn — see the note at
      the top of that generation, kept nowhere else, so this comment is the only
      record: contain-fit at ~72% of the icon's height, centred). Regenerate all of
      them together if the logo ever changes; there is no build step that does it
      automatically.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/icons/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      ORGANIZATION + LOCALBUSINESS, AS ONE @graph — static here rather than rendered
      per route, because unlike title/description it does not change per page:
      every route describes the same one company. Kept in the document shell so it
      is present even on the frame before React has hydrated, rather than riding in
      on a per-route <Seo> call the way the rest of this file's meta tags do.

      `sameAs` IS DELIBERATELY ABSENT. ContactPage.jsx's social row (Facebook,
      Instagram, YouTube) is wired to "#" placeholders — nothing has shipped yet —
      and this graph should never assert a URL nobody can follow. Add the array
      back the day those three hrefs are real.

      SITE_URL IS CONFIRMED — https://agb-media.net is the real, registered,
      live production domain (see the note at its one source of truth,
      src/data/siteMeta.js). Both `url`/`@id` fields below are literal rather
      than templated because this is static markup parsed before any JS runs;
      if the domain ever changes, it has to move here by hand alongside that
      constant.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://agb-media.net/#organization",
            "name": "AGB Media",
            "url": "https://agb-media.net/",
            "logo": "https://agb-media.net/assets/images/agb-logo.png",
            "email": "ceo@agb-media.net",
            "areaServed": {
              "@type": "AdministrativeArea",
              "name": "Doha, Qatar"
            }
          },
          {
            "@type": "LocalBusiness",
            "@id": "https://agb-media.net/#localbusiness",
            "name": "AGB Media",
            "image": "https://agb-media.net/assets/images/agb-logo.png",
            "url": "https://agb-media.net/",
            "email": "ceo@agb-media.net",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Doha",
              "addressCountry": "QA"
            },
            "areaServed": ["Qatar", "Gulf Region"]
          }
        ]
      }
    </script>

    <!--
      Manrope is loaded via @import in src/styles/global.css (Google Fonts) — the
      only external origin this site loads anything from (checked: no analytics,
      no EmailJS, no other CDN anywhere in src/). Preconnecting to both here lets
      the DNS/TLS handshake start during HTML parse instead of waiting for the
      stylesheet to resolve the @import; dns-prefetch is a plain fallback for the
      handful of browsers that honour it but not preconnect.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!--
      THE FONT FILE ITSELF, preloaded by URL rather than left to wait for the
      @import above to be discovered. Google Fonts' css2 endpoint turns out to
      serve every weight this site requests (200–700) from the exact same latin
      subset file — confirmed by fetching the stylesheet directly (`curl` with a
      modern desktop UA string, since the endpoint varies its response by
      User-Agent and an old/unrecognised one gets served ttf instead of woff2):
      every @font-face block's "latin" rule points at the identical
      xn7gYHE41ni1AdIRggexSg.woff2. One preload therefore covers the whole
      weight ladder rather than needing one per weight.

      `crossorigin` is required even though the font is same-origin-looking in
      URL terms — fonts are always fetched anonymous-mode, and a preload whose
      `crossorigin` does not match the eventual @font-face fetch is discarded
      as a wasted, unused request rather than reused.

      REGENERATE THIS URL IF THE WEIGHT LIST IN global.css'S @import EVER
      CHANGES. Google Fonts versions its files (the "/v20/" segment) and can
      reissue a new hash on its own schedule too; if Lighthouse or a build
      warning ever flags this preload as unused, re-fetch the stylesheet and
      swap the URL rather than deleting the tag.
    -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggexSg.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The hero's footage, requested during HTML parse.

      This is the whole reason hero.webm lives in public/ rather than being
      Vite-imported like story.webm. A bundled asset gets a content hash, so its URL
      does not exist until the JS chunk has been downloaded, parsed and executed and
      React has mounted Hero — which put the first frame of the site's first screen
      behind the entire critical path. From public/ the path is stable, so it can be
      named here and the fetch starts in parallel with the bundle instead of after it.

      fetchpriority="high" because this IS the first screen. Without it a preloaded
      video sits at the low priority the browser gives media by default, which is the
      right default for a video that is not the page.

      The trade: no content hash, so a replacement uploaded under the same name can be
      served from cache. Rename the file (and this line) when the footage changes.

      CHROME LOGS A WARNING ON THIS LINE and it is expected, not a bug to chase:
      "<link rel=preload> uses an unsupported `as` value". Chrome does not implement
      preload for `as="video"` — media is fetched with range requests that the preload
      cache cannot serve — so in Chrome this tag is a no-op and the fetch simply starts
      when Hero mounts. It is kept because it costs nothing, it is honoured by engines
      that do implement it, and hero.webm has to live in public/ regardless for the
      reasons above. Deleting it is a one-line change if the console noise is not worth
      it; deleting it does NOT let hero.webm move back into src/assets.

      It is also the ONLY preload link in the project. The Founder section never had
      one — its video warmed up from JS, and that section has no video at all now.
    -->
    <link
      rel="preload"
      as="video"
      href="/assets/videos/hero.webm"
      type="video/webm"
      fetchpriority="high"
    />

    <title>AGB Media | Arts &amp; Media Production House in Doha, Qatar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
